# imx708.conf - Default configuration for IMX708 camera sensor
#
# This file is read by imx708_capture and the Python bindings.
# JSON format, compatible with the profile save/load system.
#

{
  "name": "default",
  "mode_index": 0,
  "gain": 128,
  "digital_gain": 256,
  "exposure": 1000,
  "brightness": 0,
  "contrast": 128,
  "saturation": 128,
  "hue": 0,
  "sharpness": 0,
  "gamma": 128,
  "wb_temperature": 5000,
  "hdr_mode": 0,
  "test_pattern": 0,
  "hflip": 0,
  "vflip": 0
}
